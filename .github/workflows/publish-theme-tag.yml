name: Publish theme version tag

on:
  push:
    branches:
      - main
    paths:
      - style.css
      - .github/workflows/publish-theme-tag.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate theme version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing Version header: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag when missing
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
